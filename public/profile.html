<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile | PureMatch</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <nav>
        <div class="container nav-container">
            <div class="logo">
                <div class="heart-logo">
                    <svg viewBox="0 0 100 90" width="45" height="45">
                        <path d="M45,85 C20,65 5,50 5,35 C5,20 15,10 22,10 C30,10 40,20 45,30 L45,30" fill="#D97A8E" opacity="0.9"/>
                        <path d="M45,30 L45,30 C50,20 60,10 68,10 C75,10 85,20 85,35 C85,50 70,65 45,85 Z" fill="#6BA3D6" opacity="0.9"/>
                    </svg>
                </div>
                <span class="nav-links2"><a href="/"><span>PureMatch - <small>Muslim Rishta Consultation</small></span></a></span>
            </div>
            <div class="nav-contact">
                <div class="auth-nav-links">
                    <a id="signInLink" href="/signin" class="auth-nav-link">Login</a>
                    <a id="signUpLink" href="/signup" class="auth-nav-link auth-nav-link-primary">Register Now</a>
                    <a id="profileLink" href="/profile" class="auth-nav-link">Profile</a>
                    <button id="logoutButton" type="button" class="auth-nav-link auth-nav-link-primary">Logout</button>
                </div>
            </div>
        </div>
    </nav>

    <main class="auth-page">
        <div class="auth-page-card profile-page-card">
            <div class="profile-summary-card">
                <div>
                    <p class="profile-summary-label">Welcome back</p>
                    <h2 id="profileDisplayName">Your Profile</h2>
                </div>
                <div class="profile-summary-meta">
                    <div>
                        <span class="meta-label">Username</span>
                        <strong id="profileDisplayUsername">—</strong>
                    </div>
                    <div>
                        <span class="meta-label">Email</span>
                        <strong id="profileDisplayEmail">—</strong>
                    </div>
                    <div>
                        <span class="meta-label">Member since</span>
                        <strong id="profileDisplayCreatedAt">—</strong>
                    </div>
                </div>
            </div>

            <div id="authMessage" class="auth-message" style="display:none;"></div>

            <p class="profile-intro">Complete your details so we can better support your journey.</p>
            <form id="profilePageForm" class="profile-form">
                <div class="profile-grid">
                    <input type="text" name="qualification" placeholder="Qualification">
                    <input type="text" name="occupation" placeholder="Occupation">
                    <input type="number" name="age" placeholder="Age">
                    <input type="text" name="height" placeholder="Height">
                    <input type="text" name="religion" placeholder="Religion">
                    <input type="text" name="caste" placeholder="Caste">
                    <input type="text" name="language" placeholder="Language">
                    <input type="text" name="city" placeholder="City">
                    <input type="text" name="familyMembers" placeholder="Family members (siblings)">
                    <input type="text" name="familyType" placeholder="Joint family / Separate">
                    <input type="text" name="skinColor" placeholder="Color of skin">
                    <input type="text" name="reason" placeholder="Reason for marriage/registration">
                </div>
                <button type="submit">Save Profile</button>
            </form>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
