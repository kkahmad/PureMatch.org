<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | PureMatch</title>
    <link rel="stylesheet" href="/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <nav>
        <div class="container nav-container">
            <div class="logo">
                <div class="heart-logo">
                    <svg viewBox="0 0 100 90" width="45" height="45">
                        <path d="M45,85 C20,65 5,50 5,35 C5,20 15,10 22,10 C30,10 40,20 45,30 L45,30" fill="#D97A8E" opacity="0.9"/>
                        <path d="M45,30 L45,30 C50,20 60,10 68,10 C75,10 85,20 85,35 C85,50 70,65 45,85 Z" fill="#6BA3D6" opacity="0.9"/>
                    </svg>
                </div>
                <span class="nav-links2"><a href="/"><span>PureMatch - <small>Muslim Rishta Consultation</small></span></a></span>
            </div>
            <div class="nav-contact">
                <div class="auth-nav-links">
                    <a href="/" class="auth-nav-link">Home</a>
                    <a href="/admin" class="auth-nav-link auth-nav-link-primary">Admin</a>
                </div>
            </div>
        </div>
    </nav>

    <main class="admin-page">
        <div class="container admin-container">
            <div class="admin-header">
                <div>
                    <p class="admin-kicker">Management Panel</p>
                    <h1>Admin Dashboard</h1>
                </div>
            </div>

            <section class="admin-panel">
                <div class="admin-panel-header">
                    <h2>Users</h2>
                    <button type="button" id="showCreateUserForm" class="admin-primary-btn">Add User</button>
                </div>

                <div id="adminMessage" class="admin-message" style="display:none;"></div>

                <form id="adminUserForm" class="admin-form" style="display:none;">
                    <input type="hidden" name="id">
                    <div class="admin-form-grid">
                        <input type="text" name="name" placeholder="Name" required>
                        <input type="email" name="email" placeholder="Email" required>
                        <input type="text" name="username" placeholder="Username">
                        <input type="password" name="password" placeholder="Password">
                        <input type="text" name="qualification" placeholder="Qualification">
                        <input type="text" name="occupation" placeholder="Occupation">
                        <input type="text" name="age" placeholder="Age">
                        <input type="text" name="height" placeholder="Height">
                        <input type="text" name="religion" placeholder="Religion">
                        <input type="text" name="caste" placeholder="Caste">
                        <input type="text" name="language" placeholder="Language">
                        <input type="text" name="city" placeholder="City">
                        <input type="text" name="familyMembers" placeholder="Family members">
                        <input type="text" name="familyType" placeholder="Family type">
                        <input type="text" name="skinColor" placeholder="Skin color">
                        <input type="text" name="reason" placeholder="Reason for marriage/registration">
                    </div>
                    <div class="admin-form-actions">
                        <button type="submit" class="admin-primary-btn">Save User</button>
                        <button type="button" id="cancelAdminEdit" class="admin-secondary-btn">Cancel</button>
                    </div>
                </form>

                <div class="admin-table-wrap">
                    <table class="admin-table">
                        <thead>
                            <tr>
                                <th>Name</th>
                                <th>Email</th>
                                <th>Username</th>
                                <th>Created</th>
                                <th>Verified</th>
                                <th>Profile</th>
                                <th>Export</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="adminUserTableBody"></tbody>
                    </table>
                </div>
            </section>
        </div>
    </main>

    <script src="/script.js"></script>
</body>
</html>
